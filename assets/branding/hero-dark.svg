<svg width="1440" height="520" viewBox="0 0 1440 520" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Krushil Modi — Turning data into intelligence. Turning ideas into software.">
  <defs>
    <linearGradient id="hdBg" x1="0" y1="0" x2="1440" y2="520" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#070C16"/>
      <stop offset="52%" stop-color="#0C1526"/>
      <stop offset="100%" stop-color="#08101E"/>
    </linearGradient>
    <radialGradient id="hdGlowIce" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(290 110) rotate(22) scale(620 340)">
      <stop offset="0%" stop-color="#78D4FF" stop-opacity="0.18"/>
      <stop offset="60%" stop-color="#2563EB" stop-opacity="0.06"/>
      <stop offset="100%" stop-color="#080E19" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="hdGlowViolet" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(1150 220) rotate(145) scale(520 360)">
      <stop offset="0%" stop-color="#A99BFF" stop-opacity="0.20"/>
      <stop offset="55%" stop-color="#78D4FF" stop-opacity="0.09"/>
      <stop offset="100%" stop-color="#08101E" stop-opacity="0"/>
    </radialGradient>
    <pattern id="hdGrid" width="36" height="36" patternUnits="userSpaceOnUse">
      <path d="M 36 0 L 0 0 0 36" stroke="#9CAECA" stroke-opacity="0.06" stroke-width="1"/>
      <circle cx="0" cy="0" r="1" fill="#78D4FF" fill-opacity="0.14"/>
    </pattern>
    <linearGradient id="hdBorder" x1="0" y1="0" x2="1440" y2="520" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.24"/>
      <stop offset="50%" stop-color="#78D4FF" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#A99BFF" stop-opacity="0.16"/>
    </linearGradient>
    <linearGradient id="hdGlassCard" x1="820" y1="74" x2="1364" y2="440" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#1A2C49" stop-opacity="0.72"/>
      <stop offset="100%" stop-color="#0E1A2E" stop-opacity="0.62"/>
    </linearGradient>
    <linearGradient id="hdGlassRim" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.34"/>
      <stop offset="50%" stop-color="#78D4FF" stop-opacity="0.20"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.07"/>
    </linearGradient>
    <linearGradient id="hdAccentGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#78D4FF"/>
      <stop offset="100%" stop-color="#A99BFF"/>
    </linearGradient>
    <linearGradient id="hdAreaGrad" x1="1080" y1="180" x2="1080" y2="338" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#78D4FF" stop-opacity="0.28"/>
      <stop offset="100%" stop-color="#78D4FF" stop-opacity="0"/>
    </linearGradient>
    <filter id="hdShadow" x="-10%" y="-10%" width="120%" height="125%">
      <feDropShadow dx="0" dy="16" stdDeviation="18" flood-color="#02060D" flood-opacity="0.55"/>
    </filter>
  </defs>

  <!-- Outer Frame -->
  <rect x="2" y="2" width="1436" height="516" rx="28" fill="url(#hdBg)"/>
  <rect x="2" y="2" width="1436" height="516" rx="28" fill="url(#hdGrid)"/>
  <rect x="2" y="2" width="1436" height="516" rx="28" fill="url(#hdGlowIce)"/>
  <rect x="2" y="2" width="1436" height="516" rx="28" fill="url(#hdGlowViolet)"/>
  <rect x="2.75" y="2.75" width="1434.5" height="514.5" rx="27.25" stroke="url(#hdBorder)" stroke-width="1.5"/>
  <path d="M110 3.5H1330" stroke="#FFFFFF" stroke-opacity="0.22" stroke-width="1.5" stroke-linecap="round"/>

  <!-- Subtle flowing data telemetry horizons -->
  <path d="M-20 432C280 358 510 478 860 398C1110 340 1280 396 1460 350" stroke="#78D4FF" stroke-opacity="0.11" stroke-width="1.5"/>
  <path d="M-10 460C300 392 540 492 900 420C1150 370 1310 420 1460 385" stroke="#A99BFF" stroke-opacity="0.09" stroke-width="1.2"/>

  <!-- LEFT: KM Monogram, Academic Identity, Prominent Name, Tagline -->
  <g transform="translate(76, 68)">
    <!-- Monogram + Specialization Pill -->
    <g>
      <rect x="0" y="0" width="66" height="66" rx="18" fill="#142137" fill-opacity="0.86" stroke="url(#hdGlassRim)" stroke-width="1.4"/>
      <path d="M18 20V46" stroke="#EDF4FF" stroke-width="2.6" stroke-linecap="round"/>
      <path d="M29 20L19 33L29 46" stroke="url(#hdAccentGrad)" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M33 46V21L41.5 34.5L50 21V46" stroke="url(#hdAccentGrad)" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>
      <circle cx="41.5" cy="34.5" r="2" fill="#EDF4FF"/>
      <circle cx="50" cy="21" r="2.2" fill="#78D4FF"/>

      <rect x="82" y="16" width="356" height="34" rx="17" fill="#142137" fill-opacity="0.72" stroke="#78D4FF" stroke-opacity="0.24"/>
      <circle cx="100" cy="33" r="4" fill="#78D4FF"/>
      <text x="114" y="37" fill="#CBE6FF" font-family="'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12" font-weight="600" letter-spacing="0.8">M.SC. BIG DATA ANALYSIS · AHMEDABAD</text>
    </g>

    <!-- Strongest Visual Element: Krushil Modi -->
    <text x="0" y="154" fill="#EDF4FF" font-family="'Plus Jakarta Sans', 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="68" font-weight="800" letter-spacing="-1.8">Krushil <tspan fill="url(#hdAccentGrad)">Modi</tspan></text>

    <!-- Tagline -->
    <text x="0" y="206" fill="#DBE8FA" font-family="'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="22" font-weight="500" letter-spacing="-0.2">Turning data into intelligence. Turning ideas into software.</text>
    <text x="0" y="242" fill="#9CAECA" font-family="'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="15.5">Where analytical thinking meets software engineering — St. Xavier's College, Ahmedabad (2025–2027)</text>

    <!-- Three Pillar Capsules -->
    <g transform="translate(0, 294)">
      <rect x="0" y="0" width="214" height="38" rx="19" fill="#142137" fill-opacity="0.78" stroke="#78D4FF" stroke-opacity="0.30"/>
      <circle cx="20" cy="19" r="4" fill="#78D4FF"/>
      <text x="34" y="24" fill="#EDF4FF" font-family="'Inter', sans-serif" font-size="13" font-weight="600">Data Science &amp; Analytics</text>

      <rect x="228" y="0" width="204" height="38" rx="19" fill="#142137" fill-opacity="0.78" stroke="#A99BFF" stroke-opacity="0.30"/>
      <circle cx="248" cy="19" r="4" fill="#A99BFF"/>
      <text x="262" y="24" fill="#EDF4FF" font-family="'Inter', sans-serif" font-size="13" font-weight="600">AI &amp; Machine Learning</text>

      <rect x="446" y="0" width="206" height="38" rx="19" fill="#142137" fill-opacity="0.78" stroke="#FFFFFF" stroke-opacity="0.20"/>
      <circle cx="466" cy="19" r="4" fill="#78D4FF"/>
      <text x="480" y="24" fill="#EDF4FF" font-family="'Inter', sans-serif" font-size="13" font-weight="600">Software Engineering</text>
    </g>
  </g>

  <!-- RIGHT: Abstract Neural Lattice &amp; Liquid Glass Analytical Panel -->
  <g filter="url(#hdShadow)">
    <rect x="850" y="72" width="514" height="340" rx="24" fill="url(#hdGlassCard)" stroke="url(#hdGlassRim)" stroke-width="1.4"/>
    <path d="M882 73.2H1332" stroke="#FFFFFF" stroke-opacity="0.30" stroke-width="1.3" stroke-linecap="round"/>

    <!-- Top Header inside glass canvas -->
    <text x="880" y="110" fill="#EDF4FF" font-family="'Plus Jakarta Sans', 'Inter', sans-serif" font-size="15.5" font-weight="700">INTELLIGENCE IN ENGINEERING</text>
    <text x="880" y="131" fill="#9CAECA" font-family="'Inter', sans-serif" font-size="12">Statistical Models &#183; Neural Systems &#183; Full-Stack APIs</text>

    <!-- Neural Network Geometry (Left half of right card) -->
    <g stroke="#78D4FF" stroke-opacity="0.28" stroke-width="1.2">
      <line x1="896" y1="194" x2="964" y2="174"/>
      <line x1="896" y1="194" x2="964" y2="230"/>
      <line x1="896" y1="266" x2="964" y2="174"/>
      <line x1="896" y1="266" x2="964" y2="230"/>
      <line x1="896" y1="266" x2="964" y2="288"/>
      <line x1="896" y1="330" x2="964" y2="230"/>
      <line x1="896" y1="330" x2="964" y2="288"/>

      <line x1="964" y1="174" x2="1032" y2="202" stroke="#A99BFF" stroke-opacity="0.38"/>
      <line x1="964" y1="230" x2="1032" y2="202" stroke="#A99BFF" stroke-opacity="0.38"/>
      <line x1="964" y1="230" x2="1032" y2="266" stroke="#A99BFF" stroke-opacity="0.38"/>
      <line x1="964" y1="288" x2="1032" y2="266" stroke="#A99BFF" stroke-opacity="0.38"/>
    </g>
    <!-- Nodes -->
    <g>
      <circle cx="896" cy="194" r="5" fill="#0B1424" stroke="#78D4FF" stroke-width="2"/>
      <circle cx="896" cy="266" r="5" fill="#0B1424" stroke="#78D4FF" stroke-width="2"/>
      <circle cx="896" cy="330" r="5" fill="#0B1424" stroke="#78D4FF" stroke-width="2"/>
      <circle cx="964" cy="174" r="5.5" fill="#142137" stroke="#A99BFF" stroke-width="2"/>
      <circle cx="964" cy="230" r="5.5" fill="#142137" stroke="#78D4FF" stroke-width="2"/>
      <circle cx="964" cy="288" r="5.5" fill="#142137" stroke="#A99BFF" stroke-width="2"/>
      <circle cx="1032" cy="202" r="6" fill="#78D4FF"/>
      <circle cx="1032" cy="266" r="6" fill="#A99BFF"/>
    </g>

    <!-- Analytical Wave Curve (Right half of glass card) -->
    <g>
      <line x1="1074" y1="186" x2="1334" y2="186" stroke="#FFFFFF" stroke-opacity="0.08" stroke-dasharray="4 4"/>
      <line x1="1074" y1="236" x2="1334" y2="236" stroke="#FFFFFF" stroke-opacity="0.08" stroke-dasharray="4 4"/>
      <line x1="1074" y1="286" x2="1334" y2="286" stroke="#FFFFFF" stroke-opacity="0.08" stroke-dasharray="4 4"/>
      <line x1="1074" y1="336" x2="1334" y2="336" stroke="#FFFFFF" stroke-opacity="0.14"/>

      <path d="M1074 316C1112 312 1132 276 1168 282C1206 288 1228 228 1266 232C1296 236 1314 198 1334 182V336H1074V316Z" fill="url(#hdAreaGrad)"/>
      <path d="M1074 316C1112 312 1132 276 1168 282C1206 288 1228 228 1266 232C1296 236 1314 198 1334 182" stroke="url(#hdAccentGrad)" stroke-width="2.8" stroke-linecap="round"/>
      <circle cx="1168" cy="282" r="4" fill="#080E19" stroke="#78D4FF" stroke-width="2"/>
      <circle cx="1266" cy="232" r="4" fill="#080E19" stroke="#A99BFF" stroke-width="2"/>
      <circle cx="1334" cy="182" r="5" fill="#78D4FF" stroke="#EDF4FF" stroke-width="1.8"/>
    </g>

    <!-- Bottom floating discipline strip inside panel -->
    <rect x="880" y="360" width="454" height="32" rx="16" fill="#080E19" fill-opacity="0.55" stroke="#FFFFFF" stroke-opacity="0.12"/>
    <text x="1107" y="380" text-anchor="middle" fill="#9CAECA" font-family="'Inter', sans-serif" font-size="11.5" font-weight="500">Python &#183; Scikit-learn &#183; XGBoost &#183; SQL &#183; Power BI &#183; React &#183; Node.js</text>
  </g>

  <!-- Subtle overlapping floating glass pill top-right -->
  <g transform="translate(1154, 34)" filter="url(#hdShadow)">
    <rect x="0" y="0" width="234" height="60" rx="18" fill="#142137" fill-opacity="0.92" stroke="url(#hdGlassRim)" stroke-width="1.3"/>
    <circle cx="28" cy="30" r="14" fill="#78D4FF" fill-opacity="0.16" stroke="#78D4FF" stroke-opacity="0.45"/>
    <path d="M23 30L27 34L34 26" stroke="#78D4FF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="54" y="27" fill="#EDF4FF" font-family="'Inter', sans-serif" font-size="12" font-weight="700">Research &amp; Full-Stack</text>
    <text x="54" y="44" fill="#9CAECA" font-family="'Inter', sans-serif" font-size="11">BCA 8.86 CGPA · M.Sc. BDA</text>
  </g>
</svg>
