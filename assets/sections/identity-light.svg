<svg width="1200" height="310" viewBox="0 0 1200 310" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Three Professional Pillars: Data Science &amp; Analytics, AI &amp; Machine Learning, Software Engineering">
  <defs>
    <linearGradient id="idCardL" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#F2F6FC"/>
    </linearGradient>
    <linearGradient id="idRimL" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#2563EB" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#6554C0" stop-opacity="0.18"/>
    </linearGradient>
    <filter id="idShadowL" x="-6%" y="-6%" width="112%" height="118%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#17243A" flood-opacity="0.06"/>
    </filter>
  </defs>

  <!-- Card 1 -->
  <g transform="translate(8, 8)" filter="url(#idShadowL)">
    <rect x="0" y="0" width="380" height="294" rx="22" fill="url(#idCardL)" stroke="url(#idRimL)" stroke-width="1.3"/>
    <path d="M24 1.2H356" stroke="#FFFFFF" stroke-width="1.5" stroke-linecap="round"/>
    <rect x="26" y="26" width="44" height="44" rx="13" fill="#2563EB" fill-opacity="0.10" stroke="#2563EB" stroke-opacity="0.26"/>
    <path d="M38 56V46M45 56V38M52 56V42M59 56V34" stroke="#2563EB" stroke-width="2.4" stroke-linecap="round"/>
    <text x="84" y="44" fill="#2563EB" font-family="'Inter', sans-serif" font-size="11" font-weight="700" letter-spacing="1">PILLAR 01</text>
    <text x="84" y="64" fill="#17243A" font-family="'Plus Jakarta Sans', 'Inter', sans-serif" font-size="18" font-weight="700">Data Science &amp; Analytics</text>

    <line x1="26" y1="88" x2="354" y2="88" stroke="#17243A" stroke-opacity="0.08"/>
    <text x="26" y="114" fill="#17243A" font-family="'Inter', sans-serif" font-size="13.5" font-weight="600">Applied in Research &amp; Coursework</text>
    <text x="26" y="142" fill="#52627A" font-family="'Inter', sans-serif" font-size="13">&#8226; Data Cleaning &amp; Exploratory Analysis</text>
    <text x="26" y="167" fill="#52627A" font-family="'Inter', sans-serif" font-size="13">&#8226; Hypothesis Testing, ANOVA &amp; Regression</text>
    <text x="26" y="192" fill="#52627A" font-family="'Inter', sans-serif" font-size="13">&#8226; Power BI Dashboards &amp; Reporting</text>
    <text x="26" y="217" fill="#52627A" font-family="'Inter', sans-serif" font-size="13">&#8226; Time Series &amp; Econometrics (Academic)</text>

    <rect x="26" y="242" width="328" height="30" rx="15" fill="#EAF0FA" stroke="#2563EB" stroke-opacity="0.16"/>
    <text x="190" y="261" text-anchor="middle" fill="#2563EB" font-family="'Inter', sans-serif" font-size="11.5" font-weight="600">Pandas · NumPy · SciPy · Matplotlib · Power BI</text>
  </g>

  <!-- Card 2 -->
  <g transform="translate(410, 8)" filter="url(#idShadowL)">
    <rect x="0" y="0" width="380" height="294" rx="22" fill="url(#idCardL)" stroke="url(#idRimL)" stroke-width="1.3"/>
    <path d="M24 1.2H356" stroke="#FFFFFF" stroke-width="1.5" stroke-linecap="round"/>
    <rect x="26" y="26" width="44" height="44" rx="13" fill="#6554C0" fill-opacity="0.10" stroke="#6554C0" stroke-opacity="0.26"/>
    <circle cx="40" cy="40" r="2.8" fill="#6554C0"/>
    <circle cx="40" cy="56" r="2.8" fill="#6554C0"/>
    <circle cx="56" cy="48" r="3" fill="#2563EB"/>
    <line x1="42" y1="41" x2="54" y2="47" stroke="#6554C0" stroke-width="1.6"/>
    <line x1="42" y1="55" x2="54" y2="49" stroke="#6554C0" stroke-width="1.6"/>
    <text x="84" y="44" fill="#6554C0" font-family="'Inter', sans-serif" font-size="11" font-weight="700" letter-spacing="1">PILLAR 02</text>
    <text x="84" y="64" fill="#17243A" font-family="'Plus Jakarta Sans', 'Inter', sans-serif" font-size="18" font-weight="700">AI &amp; Machine Learning</text>

    <line x1="26" y1="88" x2="354" y2="88" stroke="#17243A" stroke-opacity="0.08"/>
    <text x="26" y="114" fill="#17243A" font-family="'Inter', sans-serif" font-size="13.5" font-weight="600">Modeling, Evaluation &amp; M.Sc. Study</text>
    <text x="26" y="142" fill="#52627A" font-family="'Inter', sans-serif" font-size="13">&#8226; Classification, Regression &amp; Clustering</text>
    <text x="26" y="167" fill="#52627A" font-family="'Inter', sans-serif" font-size="13">&#8226; Random Forest, XGBoost, SVM &amp; KNN</text>
    <text x="26" y="192" fill="#52627A" font-family="'Inter', sans-serif" font-size="13">&#8226; Anomaly Detection &amp; Cross-Validation</text>
    <text x="26" y="217" fill="#52627A" font-family="'Inter', sans-serif" font-size="13">&#8226; Deep Learning, NLP, CV &amp; RL (Academic)</text>

    <rect x="26" y="242" width="328" height="30" rx="15" fill="#F0EDFC" stroke="#6554C0" stroke-opacity="0.18"/>
    <text x="190" y="261" text-anchor="middle" fill="#6554C0" font-family="'Inter', sans-serif" font-size="11.5" font-weight="600">Scikit-learn · XGBoost · Isolation Forest · PINNs</text>
  </g>

  <!-- Card 3 -->
  <g transform="translate(812, 8)" filter="url(#idShadowL)">
    <rect x="0" y="0" width="380" height="294" rx="22" fill="url(#idCardL)" stroke="url(#idRimL)" stroke-width="1.3"/>
    <path d="M24 1.2H356" stroke="#FFFFFF" stroke-width="1.5" stroke-linecap="round"/>
    <rect x="26" y="26" width="44" height="44" rx="13" fill="#2563EB" fill-opacity="0.10" stroke="#2563EB" stroke-opacity="0.26"/>
    <path d="M42 42L36 48L42 54M54 42L60 48L54 54M50 39L46 57" stroke="#2563EB" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="84" y="44" fill="#2563EB" font-family="'Inter', sans-serif" font-size="11" font-weight="700" letter-spacing="1">PILLAR 03</text>
    <text x="84" y="64" fill="#17243A" font-family="'Plus Jakarta Sans', 'Inter', sans-serif" font-size="18" font-weight="700">Software Engineering</text>

    <line x1="26" y1="88" x2="354" y2="88" stroke="#17243A" stroke-opacity="0.08"/>
    <text x="26" y="114" fill="#17243A" font-family="'Inter', sans-serif" font-size="13.5" font-weight="600">APIs, Databases &amp; Web Interfaces</text>
    <text x="26" y="142" fill="#52627A" font-family="'Inter', sans-serif" font-size="13">&#8226; Full-Stack React, Vite &amp; Tailwind UIs</text>
    <text x="26" y="167" fill="#52627A" font-family="'Inter', sans-serif" font-size="13">&#8226; Node.js / Express &amp; FastAPI Services</text>
    <text x="26" y="192" fill="#52627A" font-family="'Inter', sans-serif" font-size="13">&#8226; MongoDB, MySQL, PostgreSQL / Supabase</text>
    <text x="26" y="217" fill="#52627A" font-family="'Inter', sans-serif" font-size="13">&#8226; JWT Authentication &amp; REST Workflows</text>

    <rect x="26" y="242" width="328" height="30" rx="15" fill="#EAF0FA" stroke="#17243A" stroke-opacity="0.12"/>
    <text x="190" y="261" text-anchor="middle" fill="#17243A" font-family="'Inter', sans-serif" font-size="11.5" font-weight="600">Python · JavaScript · TypeScript · React · Node.js</text>
