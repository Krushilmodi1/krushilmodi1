<svg width="1200" height="310" viewBox="0 0 1200 310" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Three Professional Pillars: Data Science &amp; Analytics, AI &amp; Machine Learning, Software Engineering">
  <defs>
    <linearGradient id="idCardD" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#142137"/>
      <stop offset="100%" stop-color="#0B1322"/>
    </linearGradient>
    <linearGradient id="idRimD" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.24"/>
      <stop offset="50%" stop-color="#78D4FF" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#A99BFF" stop-opacity="0.14"/>
    </linearGradient>
  </defs>

  <!-- Card 1: Data Science &amp; Analytics -->
  <g transform="translate(8, 8)">
    <rect x="0" y="0" width="380" height="294" rx="22" fill="url(#idCardD)" stroke="url(#idRimD)" stroke-width="1.3"/>
    <path d="M24 1.2H356" stroke="#FFFFFF" stroke-opacity="0.22" stroke-width="1.2" stroke-linecap="round"/>
    <rect x="26" y="26" width="44" height="44" rx="13" fill="#78D4FF" fill-opacity="0.12" stroke="#78D4FF" stroke-opacity="0.32"/>
    <path d="M38 56V46M45 56V38M52 56V42M59 56V34" stroke="#78D4FF" stroke-width="2.4" stroke-linecap="round"/>
    <text x="84" y="44" fill="#78D4FF" font-family="'Inter', sans-serif" font-size="11" font-weight="700" letter-spacing="1">PILLAR 01</text>
    <text x="84" y="64" fill="#EDF4FF" font-family="'Plus Jakarta Sans', 'Inter', sans-serif" font-size="18" font-weight="700">Data Science &amp; Analytics</text>

    <line x1="26" y1="88" x2="354" y2="88" stroke="#FFFFFF" stroke-opacity="0.08"/>
    <text x="26" y="114" fill="#CBD8EE" font-family="'Inter', sans-serif" font-size="13.5" font-weight="600">Applied in Research &amp; Coursework</text>
    <text x="26" y="142" fill="#9CAECA" font-family="'Inter', sans-serif" font-size="13">&#8226; Data Cleaning &amp; Exploratory Analysis</text>
    <text x="26" y="167" fill="#9CAECA" font-family="'Inter', sans-serif" font-size="13">&#8226; Hypothesis Testing, ANOVA &amp; Regression</text>
    <text x="26" y="192" fill="#9CAECA" font-family="'Inter', sans-serif" font-size="13">&#8226; Power BI Dashboards &amp; Reporting</text>
    <text x="26" y="217" fill="#9CAECA" font-family="'Inter', sans-serif" font-size="13">&#8226; Time Series &amp; Econometrics (Academic)</text>

    <rect x="26" y="242" width="328" height="30" rx="15" fill="#080E19" fill-opacity="0.65" stroke="#78D4FF" stroke-opacity="0.20"/>
    <text x="190" y="261" text-anchor="middle" fill="#78D4FF" font-family="'Inter', sans-serif" font-size="11.5" font-weight="600">Pandas · NumPy · SciPy · Matplotlib · Power BI</text>
  </g>

  <!-- Card 2: AI &amp; Machine Learning -->
  <g transform="translate(410, 8)">
    <rect x="0" y="0" width="380" height="294" rx="22" fill="url(#idCardD)" stroke="url(#idRimD)" stroke-width="1.3"/>
    <path d="M24 1.2H356" stroke="#FFFFFF" stroke-opacity="0.22" stroke-width="1.2" stroke-linecap="round"/>
    <rect x="26" y="26" width="44" height="44" rx="13" fill="#A99BFF" fill-opacity="0.14" stroke="#A99BFF" stroke-opacity="0.34"/>
    <circle cx="40" cy="40" r="2.8" fill="#A99BFF"/>
    <circle cx="40" cy="56" r="2.8" fill="#A99BFF"/>
    <circle cx="56" cy="48" r="3" fill="#78D4FF"/>
    <line x1="42" y1="41" x2="54" y2="47" stroke="#A99BFF" stroke-width="1.6"/>
    <line x1="42" y1="55" x2="54" y2="49" stroke="#A99BFF" stroke-width="1.6"/>
    <text x="84" y="44" fill="#A99BFF" font-family="'Inter', sans-serif" font-size="11" font-weight="700" letter-spacing="1">PILLAR 02</text>
    <text x="84" y="64" fill="#EDF4FF" font-family="'Plus Jakarta Sans', 'Inter', sans-serif" font-size="18" font-weight="700">AI &amp; Machine Learning</text>

    <line x1="26" y1="88" x2="354" y2="88" stroke="#FFFFFF" stroke-opacity="0.08"/>
    <text x="26" y="114" fill="#CBD8EE" font-family="'Inter', sans-serif" font-size="13.5" font-weight="600">Modeling, Evaluation &amp; M.Sc. Study</text>
    <text x="26" y="142" fill="#9CAECA" font-family="'Inter', sans-serif" font-size="13">&#8226; Classification, Regression &amp; Clustering</text>
    <text x="26" y="167" fill="#9CAECA" font-family="'Inter', sans-serif" font-size="13">&#8226; Random Forest, XGBoost, SVM &amp; KNN</text>
    <text x="26" y="192" fill="#9CAECA" font-family="'Inter', sans-serif" font-size="13">&#8226; Anomaly Detection &amp; Cross-Validation</text>
    <text x="26" y="217" fill="#9CAECA" font-family="'Inter', sans-serif" font-size="13">&#8226; Deep Learning, NLP, CV &amp; RL (Academic)</text>

    <rect x="26" y="242" width="328" height="30" rx="15" fill="#080E19" fill-opacity="0.65" stroke="#A99BFF" stroke-opacity="0.22"/>
    <text x="190" y="261" text-anchor="middle" fill="#A99BFF" font-family="'Inter', sans-serif" font-size="11.5" font-weight="600">Scikit-learn · XGBoost · Isolation Forest · PINNs</text>
  </g>

  <!-- Card 3: Software Engineering -->
  <g transform="translate(812, 8)">
    <rect x="0" y="0" width="380" height="294" rx="22" fill="url(#idCardD)" stroke="url(#idRimD)" stroke-width="1.3"/>
    <path d="M24 1.2H356" stroke="#FFFFFF" stroke-opacity="0.22" stroke-width="1.2" stroke-linecap="round"/>
    <rect x="26" y="26" width="44" height="44" rx="13" fill="#78D4FF" fill-opacity="0.12" stroke="#78D4FF" stroke-opacity="0.30"/>
    <path d="M42 42L36 48L42 54M54 42L60 48L54 54M50 39L46 57" stroke="#78D4FF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="84" y="44" fill="#78D4FF" font-family="'Inter', sans-serif" font-size="11" font-weight="700" letter-spacing="1">PILLAR 03</text>
    <text x="84" y="64" fill="#EDF4FF" font-family="'Plus Jakarta Sans', 'Inter', sans-serif" font-size="18" font-weight="700">Software Engineering</text>

    <line x1="26" y1="88" x2="354" y2="88" stroke="#FFFFFF" stroke-opacity="0.08"/>
    <text x="26" y="114" fill="#CBD8EE" font-family="'Inter', sans-serif" font-size="13.5" font-weight="600">APIs, Databases &amp; Web Interfaces</text>
    <text x="26" y="142" fill="#9CAECA" font-family="'Inter', sans-serif" font-size="13">&#8226; Full-Stack React, Vite &amp; Tailwind UIs</text>
    <text x="26" y="167" fill="#9CAECA" font-family="'Inter', sans-serif" font-size="13">&#8226; Node.js / Express &amp; FastAPI Services</text>
    <text x="26" y="192" fill="#9CAECA" font-family="'Inter', sans-serif" font-size="13">&#8226; MongoDB, MySQL, PostgreSQL / Supabase</text>
    <text x="26" y="217" fill="#9CAECA" font-family="'Inter', sans-serif" font-size="13">&#8226; JWT Authentication &amp; REST Workflows</text>

    <rect x="26" y="242" width="328" height="30" rx="15" fill="#080E19" fill-opacity="0.65" stroke="#FFFFFF" stroke-opacity="0.16"/>
    <text x="190" y="261" text-anchor="middle" fill="#CBD8EE" font-family="'Inter', sans-serif" font-size="11.5" font-weight="600">Python · JavaScript · TypeScript · React · Node.js</text>
  </g>
</svg>
